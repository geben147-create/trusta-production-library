function render(){let q=$('#q').value.toLowerCase(),m=$('#module').value,r=$('#refresh').value,a=D.rows.filter(x=>(!m||m===x['분야'])&&(!r||r===x['갱신코드'])&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if($('#sort').value==='launch')a.sort((x,y)=>(x['추천발행순서']??999)-(y['추천발행순서']??999));$('#count').textContent=`${a.length}편 표시`;$('#list').innerHTML=a.map(x=>`<article class="episode" style="--accent:${D.colors[D.modules.indexOf(x['분야'])]}"><div class="kicker">${E(x.ID)} · ${E(x['분야'])} ${x['추천발행순서']?' · 발행 '+x['추천발행순서']+'순위':''}</div><h2>${E(x['제목'])}</h2><div class="hook">${E(x['첫훅'])}</div><div class="card-preview"><h3>세로 원페이지 문구</h3>${list(x['원페이지문구'])}<p><strong>결론</strong> ${E(x['큰반전·결론'])}</p></div><div class="small">그림: ${E(x['시각화'])}</div><div class="status">${E(x['갱신규칙'])} · ${E(x['발행상태'])}</div><div class="small"><b>상품:</b> ${E(x['도구·보고서'])}</div><div class="actions"><button onclick="showPoster('${x.ID}')">9:16 카드 미리보기</button><button class="secondary" onclick="copyCard('${x.ID}',this)">문구 복사</button></div><details><summary>롱폼 10단계 · 작은 반전/큰 반전</summary><div class="detail">${list(x['롱폼아웃라인'],'ol')}</div></details><details><summary>PPT 10장 · 영상 제작 지시</summary><div class="detail">${list(x['PPT10장'],'ol')}<p>${E(x['이미지지시'])}</p><p>${E(x['롱폼제작'])}</p></div></details><details><summary>데이터·공식 근거·성과 원본</summary><div class="detail"><p><b>필수 수집:</b> ${E(x['필요데이터'])}</p><ul>${x['원천ID'].map(k=>{let s=D.sources[k];return `<li>${link(s['원천'],s.URL)} · ${E(s['상태'])}</li>`}).join('')}</ul><ul>${x['벤치마크ID'].map(k=>{let b=D.bench[k];return `<li>${link(b['채널']+' · '+b['제목'],b['영상URL'])} ${b['조회/구독배수']!=null?'('+b['조회/구독배수']+'배)':''} · ${E(b['분석·주의'])}${b['자막경로']?' · '+link('자막 원본',b['자막경로']):''}</li>`}).join('')}</ul></div></details></article>`).join('')}
function episode(id){return D.rows.find(x=>x.ID===id)}function showPoster(id){let x=episode(id);$('#poster').innerHTML=`<div class="poster" style="--accent:${D.colors[D.modules.indexOf(x['분야'])]}"><div class="kicker">TRUSTA AI LAB · ${E(x.ID)} · 교육용 초안</div><h2>${E(x['제목'])}</h2><div class="rule"></div><p class="hook">${E(x['첫훅'])}</p>${x['원페이지문구'].map(b=>`<div class="bullet">${E(b)}</div>`).join('')}<div class="answer">${E(x['큰반전·결론'])}</div><footer>시각화: ${E(x['시각화'])}<br>근거: ${E(x['원천ID'].join(' · '))} / ${E(x['갱신규칙'])}<br>발행 전 수치·기준일·원문 검수 · 투자 수익 보장 없음</footer></div>`;$('#overlay').style.display='flex'}function closePoster(){$('#overlay').style.display='none'}function printPoster(){document.body.classList.add('printcard');window.print();document.body.classList.remove('printcard')}async function copyCard(id,b){let x=episode(id),t=[x['제목'],x['첫훅'],...x['원페이지문구'],x['큰반전·결론'],'출처: '+x['원천URL'].join(' ')].join('\n');try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}b.textContent='복사 시도 완료';setTimeout(()=>b.textContent='문구 복사',1500)}['q','module','refresh','sort'].forEach(k=>$('#'+k).addEventListener(k==='q'?'input':'change',render));render();</script></body></html>
