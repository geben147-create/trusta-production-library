<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>마지막 월급 다음 달</title>
<style>
@font-face{font-family:Jalnan;src:url('file:///home/yh/.local/share/fonts/JalnanGothic/JalnanGothic.ttf')}
*{box-sizing:border-box}
body{margin:0;width:1920px;height:1080px;padding:46px 58px;background:#f5eee2;color:#202d32;font-family:Jalnan,sans-serif}
h1{font-size:72px;line-height:1;margin:0 0 24px;letter-spacing:-3px}
mark{background:#fff0ac;color:inherit;padding:0 .14em}
b{color:#8c2933}
main{display:grid;grid-template-columns:575px 1fr;gap:25px;height:800px}
.character{position:relative;overflow:hidden;border:4px solid #293237;border-radius:20px;background:#fffaf0}
.hero{position:absolute;left:3px;top:56px;width:280px;height:249px;object-fit:none;object-position:50% 0;border-radius:22px}
.friend{position:absolute;right:10px;top:297px;width:246px;height:189px;overflow:hidden;border:4px solid #293237;border-radius:24px;background:#ba927a}
.friend img{position:absolute;width:238px;top:-25px;left:0;clip-path:inset(0 17px 0 0)}
.bubble{position:absolute;background:#fffef8;border:3px solid #293237;border-radius:26px;padding:16px 20px;font-size:34px;line-height:1.3}
.bubble:after{content:'';position:absolute;width:16px;height:16px;background:#fffef8;border-bottom:3px solid #293237;border-right:3px solid #293237;transform:rotate(45deg);bottom:-11px;left:29px}
.a{right:12px;top:44px}.b{left:15px;top:347px;font-size:29px}.b:after{left:auto;right:20px}
.calendar{position:absolute;left:21px;right:21px;bottom:24px;padding:27px;background:#f8e4bc;border:3px solid #9d6a43;border-radius:14px}
.calendar div{font-size:32px;margin-bottom:12px}
.calendar p{margin:12px 0;font-size:29px;letter-spacing:-.4px}
.calendar strong{padding:3px 8px;background:#fff5ca}
.chart{border:4px solid #293237;border-radius:20px;background:#fffaf0;overflow:hidden;padding:22px 24px}
.chart h2{font-size:42px;margin:0 0 12px}
.chart p{font-size:25px;margin:8px 0}
.chart img{display:block;width:100%;height:550px;object-fit:contain;background:#f8f4ea;border-radius:13px}
.bottom{border-top:2px solid #bcac97;margin-top:20px;padding-top:13px;font-size:25px;display:flex;justify-content:space-between}
</style>
<h1>마지막 월급 <mark>다음 달</mark>엔 뭘로 생활할까?</h1>
<main>
<section class="character" aria-label="천억이와 수건 친구의 대화">
<img class="hero" src="../../집필인계/천억이_시그니처표정.png" alt="입을 크게 벌린 천억이">
<div class="bubble a">다음 달 월급 칸이<br>비었어!</div>
<div class="friend"><img src="../../집필인계/천억이_수건친구.png" alt="손을 들어 달력 쪽을 가리키는 수건 친구"></div>
<div class="bubble b">첫 연금 들어오는<br>날부터 확인하자.</div>
<div class="calendar"><div>퇴직 뒤 첫 달 달력</div><p><strong>월급</strong>　지급 종료</p><p><strong>생활비</strong>　납부일 확인</p><p><strong>연금</strong>　<b>첫 입금일 확인</b></p></div>
</section>
<section class="chart">
<h2>은퇴 직전 투자 자산이 <b>15% 하락</b>하면</h2>
<p>같은 시작 잔액 2억 2,624만 원 · 첫해 생활비 2,400만 원</p>
<img src="glass/reserve_표기.png" alt="생활비를 모두 낸 뒤 현금 분리 여부에 따른 잔액. 현금 없음 16,830.35만 원, 생활비 절반 현금 17,010.35만 원, 생활비 전액 현금 17,190.35만 원.">
<p>첫해 생활비를 모두 낸 뒤의 잔액 · 원화 가상 예시 · 세금·비용 제외</p>
<p>시장에 남겨 둔 돈만 하락한다고 가정했어요.</p>
</section>
</main>
<footer class="bottom"><span>TRUSTA 투자연구소</span><span>오늘 확인할 것　<b>첫 연금 입금일과 첫 생활비 납부일</b></span></footer>
