<!DOCTYPE html><html lang="ko"><meta charset="utf-8"><title>금색 스티커 두 장</title><style>
@font-face{font-family:Jalnan;src:url('file:///home/yh/.local/share/fonts/JalnanGothic/JalnanGothic.ttf')}
*{box-sizing:border-box}body{margin:0;width:1920px;height:1080px;padding:32px 54px;background:#f5eee0;color:#233038;font-family:Jalnan,sans-serif}
h1{font-size:65px;line-height:1.1;letter-spacing:-2px;margin:0 0 14px}mark{background:#fff0ab;color:inherit;padding:0 6px}b{color:#90272d}
.scene{position:relative;height:235px;background:#fdf8ed;border:4px solid #333d3e;border-radius:19px;overflow:hidden}
.hero{position:absolute;left:37px;top:8px;width:250px;height:225px;object-fit:none;object-position:50% 0}.friend{position:absolute;right:37px;top:14px;width:220px;height:205px;overflow:hidden;border-radius:17px;background:#a97f61}.friend img{width:220px;position:absolute;top:-24px;clip-path:inset(0 17px 0 18px)}
.speech{position:absolute;top:36px;border:3px solid #333d3e;border-radius:26px;background:#fffef8;padding:18px 22px;font-size:33px;line-height:1.35}
.speech:before{content:"";position:absolute;top:62px;width:16px;height:16px;background:#fffef8;border:3px solid #333d3e;transform:rotate(45deg)}
.a{left:283px}.a:before{left:-12px;border-top:none;border-right:none}.b{right:272px}.b:before{right:-11px;border-left:none;border-bottom:none}
.charts{margin-top:19px;display:grid;grid-template-columns:1fr 1fr;gap:25px}
figure{margin:0;height:569px;overflow:hidden;border:4px solid #333d3e;border-radius:18px;background:#fffaf0;padding:15px 20px}figcaption{font-size:36px;margin:0 0 9px}figure img{display:block;height:427px;width:100%;object-fit:contain;background:#f8f4ea;border-radius:10px}figure p{margin:10px 0 0;font-size:24px}
footer{font-size:23px;margin-top:15px;border-top:2px solid #c0ae94;padding-top:13px;display:flex;justify-content:space-between}
</style>
<h1>분배금 1등이 <mark>가장 많이 번 ETF</mark>일까?</h1>
<section class="scene" aria-label="두 캐릭터의 대화">
<img class="hero" src="../../집필인계/천억이_시그니처표정.png" alt="깜짝 놀란 천억이">
<div class="speech a">A가 12만 원을 줬어!<br>그럼 A가 1등 아냐?</div>
<div class="friend"><img src="../../집필인계/천억이_수건친구.png" alt="손을 들어 차트를 가리키는 수건 친구"></div>
<div class="speech b">받은 돈에 남은 펀드 값도 더해 봐.<br>그 기준으로는 <b>B가 1등</b>이야.</div>
</section>
<div class="charts">
<figure><figcaption>원금 대비 <mark>받은 현금</mark></figcaption><img src="glass/cash_표기.png" alt="상품 A 12%, 상품 B 4%, 상품 C 9%"><p>A 12만 원 · B 4만 원 · C 9만 원</p></figure>
<figure><figcaption>펀드와 현금을 합친 <mark>1년 수익률</mark></figcaption><img src="glass/return_표기.png" alt="상품 A 2%, 상품 B 8%, 상품 C 6%"><p>A 수익 2만 원 · B 수익 8만 원 · C 수익 6만 원</p></figure>
</div>
<footer><span>가상 비교 · 원화 각 100만 원 · 1년 · 분배금은 현금 보관 · 세금과 비용 제외</span><span>TRUSTA 투자연구소</span></footer>
</html>
